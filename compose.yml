# This app does NOT run its own Postgres. It connects to the existing
# ask-my-cars Postgres instance over the LAN (POSTGRES_HOST in .env,
# confirmed reachable at 192.168.1.128:5432 per Task 3's verification)
# instead of provisioning a duplicate database. Do NOT add a postgres
# service here — ask-my-cars' Postgres is the system of record for this
# data, this repo only ever reads/writes to it as a client.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
