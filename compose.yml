# This app does NOT run its own Postgres. It connects to the existing
# ask-my-cars Postgres instance as a client (POSTGRES_HOST in .env —
# "localhost" on this host, since Postgres runs directly on the same
# machine; a different host would instead need its actual LAN IP there)
# instead of provisioning a duplicate database. Do NOT add a postgres
# service here — ask-my-cars' Postgres is the system of record for this
# data, this repo only ever reads/writes to it as a client.
services:
  app:
    build: .
    # POSTGRES_HOST in .env is "localhost" (Postgres runs on this same
    # host) -- host networking is required for the container to reach it,
    # same as every docker run --network host used to verify this app
    # throughout development. Also means the app listens directly on the
    # host's port 8000 (see Dockerfile's EXPOSE) -- no ports: mapping needed.
    network_mode: host
    env_file:
      - .env
    restart: unless-stopped
